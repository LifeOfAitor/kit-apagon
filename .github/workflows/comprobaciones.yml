# Runs every mandatory check on each pull request and on every change that reaches main.
# External actions are pinned to a commit hash so their code cannot change without a review here.

name: Comprobaciones

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Downloaded dependencies are cached between runs. Maven Central answers 429 (too many requests) to
# the shared GitHub runners, above all for large files such as Robolectric's 165 MB native runtime,
# and Sonatype recommends caching as the fix. The cache falls back to the most recent entry when the
# build files change, and it is saved even when a run fails, so a retry does not download it all again.
env:
  DEPENDENCY_CACHE_PATHS: |
    ~/.gradle/caches
    ~/.gradle/wrapper
    ~/.m2/repository

jobs:
  verify-all:
    name: Comprobaciones completas
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history is needed to check the commit messages of the pull request.
          fetch-depth: 0

      - name: Instalar JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Verificar que el lanzador de Gradle es el oficial
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Restaurar las dependencias descargadas
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPENDENCY_CACHE_PATHS }}
          key: dependencies-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dependencies-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}-
            dependencies-${{ runner.os }}-

      - name: Comprobar que los mensajes de commit no tienen emojis
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: scripts/check-no-emoji.sh "origin/$BASE_BRANCH..HEAD"

      - name: Ejecutar todas las comprobaciones
        # Repeated only when a download fails, never when the code fails (decision 0012).
        run: scripts/run-with-download-retries.sh ./gradlew verifyAll --console=plain

      - name: Detener Gradle para que la caché no guarde archivos a medio escribir
        if: always()
        run: ./gradlew --stop

      - name: Guardar las dependencias descargadas
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DEPENDENCY_CACHE_PATHS }}
          key: dependencies-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Guardar los informes si algo falla
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informes
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
