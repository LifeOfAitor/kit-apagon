# Runs every mandatory check on each pull request and on every change that reaches main.
# External actions are pinned to a commit hash so their code cannot change without a review here.

name: Comprobaciones

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-all:
    name: Comprobaciones completas
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history is needed to check the commit messages of the pull request.
          fetch-depth: 0

      - name: Instalar JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Verificar que el lanzador de Gradle es el oficial
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Open-source (MIT) cache instead of the default proprietary one.
          cache-provider: basic

      - name: Comprobar que los mensajes de commit no tienen emojis
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: scripts/check-no-emoji.sh "origin/$BASE_BRANCH..HEAD"

      - name: Ejecutar todas las comprobaciones
        run: ./gradlew verifyAll --console=plain

      - name: Guardar los informes si algo falla
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informes
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
