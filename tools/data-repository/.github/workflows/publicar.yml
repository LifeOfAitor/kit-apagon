# Template of the workflow of the data repository kit-apagon-datos (decision 0014 of kit-apagon). It
# is copied there by hand; GitHub does not run it from this folder. The steps live in the app
# repository, at the commit fixed in GENERATOR_COMMIT, so that they are reviewed and tested there.

name: Publicar los paquetes

on:
  schedule:
    # Day 2 of every month at 03:00 UTC.
    - cron: "0 3 2 * *"
  workflow_dispatch:
    inputs:
      provincias:
        description: "Solo estas provincias, separadas por comas, para una prueba (vacío: todas)"
        required: false
        default: ""
      publicar_indice:
        description: "Publicar el índice como versión nueva (solo con todas las provincias)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

env:
  # Commit of LifeOfAitor/kit-apagon whose generator and scripts publish the data. Changed on purpose only.
  GENERATOR_COMMIT: COMMIT_DEL_GENERADOR
  PMTILES_VERSION: 1.31.2
  # SHA-256 that GitHub records for go-pmtiles_1.31.2_Linux_x86_64.tar.gz in its official release.
  PMTILES_SHA256: 3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f

jobs:
  publicar:
    name: Generar y publicar
    runs-on: ubuntu-24.04
    # Under the 6 hours GitHub allows, so that a stuck run ends before the limit cuts it.
    timeout-minutes: 345
    steps:
      - name: Descargar este repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: datos

      - name: Descargar el generador
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LifeOfAitor/kit-apagon
          ref: ${{ env.GENERATOR_COMMIT }}
          path: generador
          persist-credentials: false

      - name: Instalar JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar osmium
        run: sudo apt-get update && sudo apt-get install --yes osmium-tool

      - name: Instalar pmtiles
        run: |
          curl --fail --silent --show-error --location --output pmtiles.tar.gz \
            "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz"
          echo "${PMTILES_SHA256}  pmtiles.tar.gz" | sha256sum --check
          tar -xzf pmtiles.tar.gz pmtiles
          sudo install pmtiles /usr/local/bin/pmtiles

      - name: Compilar el generador
        working-directory: generador
        # Repeated only when a download fails (decision 0012 of kit-apagon).
        run: scripts/run-with-download-retries.sh ./gradlew --no-daemon --console=plain :tools:package-generator:installDist

      - name: Generar y publicar
        env:
          GH_TOKEN: ${{ github.token }}
          KIT_APAGON_INDEX_SIGNING_KEY: ${{ secrets.KIT_APAGON_INDEX_SIGNING_KEY }}
          DATA_REPOSITORY: ${{ github.repository }}
          DATA_CHECKOUT: ${{ github.workspace }}/datos
          PROVINCES: ${{ inputs.provincias }}
          PUBLISH_INDEX: ${{ github.event_name == 'schedule' || inputs.publicar_indice }}
        run: generador/scripts/publish-monthly-packages.sh
